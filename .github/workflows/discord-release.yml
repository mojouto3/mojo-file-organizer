name: Discord Release Notification

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord embed
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          echo "Webhook is set: $([ -n "$DISCORD_WEBHOOK" ] && echo YES || echo NO)"
          echo "Tag: $RELEASE_TAG"

          PAYLOAD=$(jq -n \
            --arg title "Mojo File Organizer $RELEASE_TAG" \
            --arg url "$RELEASE_URL" \
            --arg version "$RELEASE_TAG" \
            '{
              username: "Mojo File Organizer",
              embeds: [{
                title: $title,
                url: $url,
                description: ("New release available! Click the title to download."),
                color: 4053821,
                fields: [
                  { name: "Version", value: $version, inline: true },
                  { name: "Platform", value: "Windows x64", inline: true }
                ],
                footer: { text: "mojouto3/mojo-file-organizer" }
              }]
            }')

          echo "Payload built successfully"

          HTTP_CODE=$(curl -v -o /tmp/response.txt -w "%{http_code}" \
            -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" 2>&1)

          echo "HTTP Code: $HTTP_CODE"
          echo "Response: $(cat /tmp/response.txt)"
